[project]
name = "shodan-mcp"
version = "0.1.0"
description = "MCP server that drives a Shodan account end-to-end (account/host/search/DNS/scan/alerts) with credit-aware paginated ingest via the Shodan search cursor."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "shodan>=1.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shodan_mcp"]

[project.scripts]
shodan-mcp = "shodan_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
