[project]
name = "shodan-mcp"
version = "0.1.0"
description = "Governed MCP server for Shodan search, host intelligence, DNS, scans, alerts, and credit-aware ingest."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "fastmcp>=3.4",
    "shodan>=1.31",
    "mcp-safety-core @ git+https://github.com/revoydotdev/mcp-safety-core@v0.1.1",
]

[project.urls]
Homepage = "https://github.com/revoydotdev/shodan-mcp"
Repository = "https://github.com/revoydotdev/shodan-mcp"
Issues = "https://github.com/revoydotdev/shodan-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/shodan_mcp"]

[project.scripts]
shodan-mcp = "shodan_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
"src/shodan_mcp/server.py" = ["BLE001"] # MCP boundary converts provider failures to structured errors.
